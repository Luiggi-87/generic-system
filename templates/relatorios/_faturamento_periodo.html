<form method="get" action="{{ request.path }}" style="display:flex;gap:8px;align-items:end;flex-wrap:wrap">
  <div><label>Mês</label>
    <select name="mes">{% for i in range(1, 13) %}<option value="{{ i }}" {% if i == d.mes %}selected{% endif %}>{{ meses[i-1] }}</option>{% endfor %}</select></div>
  <div><label>Ano</label>
    <select name="ano">{% for a in anos %}<option value="{{ a }}" {% if a == d.ano %}selected{% endif %}>{{ a }}</option>{% endfor %}</select></div>
  {% if not so_propria %}
  <input type="hidden" name="despesa_pct" value="{{ d.pct }}">
  <input type="hidden" name="criterio" value="{{ d.criterio }}">
  {% if d.a_receber %}<input type="hidden" name="a_receber" value="1">{% endif %}
  {% if d.modelo == 'despesas' %}<input type="hidden" name="modelo" value="despesas">{% endif %}
  {% endif %}
  <button class="btn">Ver</button>
</form>

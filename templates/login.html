<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — {{ marca.nome }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  {% include '_marca_css.html' %}
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--cm-accent) 0%, var(--cm-accent) 40%, #e1bee7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(136, 14, 79, 0.15);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }

    .brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-icon {
      font-size: 2.8rem;
      color: var(--cm-primary);
      display: block;
      margin-bottom: .5rem;
    }
    .brand-name {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--cm-primary-dark);
      letter-spacing: -.5px;
    }
    .brand-sub {
      font-size: .82rem;
      color: #aaa;
      margin-top: 2px;
    }

    .form-label { font-size: .85rem; font-weight: 600; color: #555; }

    .form-control:focus {
      border-color: var(--cm-primary);
      box-shadow: 0 0 0 .2rem rgba(var(--cm-primary-rgb),.15);
    }

    .btn-login {
      background: linear-gradient(135deg, var(--cm-primary), var(--cm-primary-dark));
      border: none;
      color: #fff;
      font-weight: 600;
      padding: .65rem;
      border-radius: 10px;
      font-size: .95rem;
      transition: opacity .2s;
    }
    .btn-login:hover { opacity: .9; color: #fff; }

    .input-group-text {
      background: var(--cm-accent);
      border-color: #dee2e6;
      color: var(--cm-primary);
    }
  </style>
</head>
<body>

<div class="login-card">
  <!-- Brand -->
  <div class="brand">
    {% if marca.logo %}<img src="{{ url_for('static', filename=marca.logo) }}" alt="" style="height:56px;margin-bottom:.5rem">{% else %}<i class="bi bi-{{ marca.icone }} brand-icon"></i>{% endif %}
    <div class="brand-name">{{ marca.nome }}</div>
    <div class="brand-sub">{{ marca.subtitulo }}</div>
  </div>

  <!-- Alertas -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category }} py-2 px-3 mb-3" style="font-size:.85rem">
      {{ message }}
    </div>
    {% endfor %}
  {% endwith %}

  <!-- Formulário -->
  <form method="post" action="{{ url_for('login') }}">
    <div class="mb-3">
      <label class="form-label">E-mail</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" name="email" class="form-control"
               placeholder="seu@email.com" required autofocus>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Senha</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" name="senha" id="senha" class="form-control"
               placeholder="••••••••" required>
        <button type="button" class="btn btn-outline-secondary"
                onclick="toggleSenha()" tabindex="-1">
          <i class="bi bi-eye" id="icon-eye"></i>
        </button>
      </div>
    </div>

    <div class="mb-4 d-flex align-items-center">
      <input type="checkbox" name="lembrar" id="lembrar" class="form-check-input me-2">
      <label for="lembrar" class="form-check-label" style="font-size:.83rem;color:#777">
        Manter conectado
      </label>
    </div>

    <button type="submit" class="btn btn-login w-100">
      <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
    </button>
  </form>
</div>

<script>
function toggleSenha() {
  const inp  = document.getElementById('senha');
  const icon = document.getElementById('icon-eye');
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'bi bi-eye';
  }
}
</script>

</body>
</html>

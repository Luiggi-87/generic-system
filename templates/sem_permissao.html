{% extends 'base.html' %}
{% block title %}Sem permissão — {{ marca.nome }}{% endblock %}
{% block page_title %}Sem permissão{% endblock %}
{% block content %}
<div class="text-center py-5">
  <i class="bi bi-lock" style="font-size:3rem;opacity:.3"></i>
  <h5 class="mt-3">Você não tem acesso a esta área</h5>
  <p class="text-muted">{{ mensagem or 'Peça à administradora para liberar o acesso que você precisa.' }}</p>
  <a href="{{ url_for('logout') }}" class="btn btn-outline-secondary btn-sm">Sair</a>
</div>
{% endblock %}
